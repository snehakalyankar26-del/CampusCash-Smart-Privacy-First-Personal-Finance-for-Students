# ==============================================================================
# CampusCash - Production Netlify Configuration
# Static assets, Edge CDN caching, Strict CSP headers, and Serverless API Functions
# ==============================================================================

[build]
  publish = "public"
  functions = "netlify/functions"

# Security Headers (Matching Helmet CSP & Protection)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caching for Static Assets (CSS, JS, SVG)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Revalidation for HTML root
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# API & Health Check Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

# Client-Side SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
